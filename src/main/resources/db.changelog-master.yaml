databaseChangeLog:
  - changeSet:
      id: 1-create-users
      author: me
      changes:
        - createTable:
            tableName: user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-create-accounts
      author: me
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: userid
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: account
            baseColumnNames: userid
            referencedTableName: user
            referencedColumnNames: id
            constraintName: fk_accounts_user

  - changeSet:
      id: 3-create-transaction-category
      author: me
      changes:
        - createTable:
            tableName: transaction_category
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transaction_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: userid
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transaction_category
            baseColumnNames: userid
            referencedTableName: user
            referencedColumnNames: id
            constraintName: fk_category_user

  - changeSet:
      id: 4-create-transaction
      author: me
      changes:
        - createTable:
            tableName: transaction
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_account_id
                  type: BIGINT
              - column:
                  name: to_account_id
                  type: BIGINT
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transaction
            baseColumnNames: from_account_id
            referencedTableName: account
            referencedColumnNames: id
            constraintName: fk_transaction_from_account
        - addForeignKeyConstraint:
            baseTableName: transaction
            baseColumnNames: to_account_id
            referencedTableName: account
            referencedColumnNames: id
            constraintName: fk_transaction_to_account
        - addForeignKeyConstraint:
            baseTableName: transaction
            baseColumnNames: category_id
            referencedTableName: transaction_category
            referencedColumnNames: id
            constraintName: fk_transaction_category

  - changeSet:
      id: 2-add-default-balance
      author: me
      changes:
        - addDefaultValue:
            tableName: account
            columnName: balance
            columnDataType: BIGINT
            defaultValue: 0

  - changeSet:
      id: 5-add-default-datetime-transaction
      author: me
      changes:
        - addDefaultValue:
            tableName: transaction
            columnName: date_time
            columnDataType: TIMESTAMP
            defaultValueComputed: current_datetime()
  - changeSet:
      id: 6-add-mandatory-column-with-default
      author: me
      changes:
        - addColumn:
            tableName: user
            columns:
              - column:
                  name: role
                  type: varchar(255)
                  defaultValue: "USER"
                  constraints:
                    nullable: false
