databaseChangeLog:
  - changeSet:
      id: 1-create-users
      author: me
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-create-accounts
      author: me
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: userid
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: accounts
            baseColumnNames: userid
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_accounts_users

  - changeSet:
      id: 3-create-transaction-category
      author: me
      changes:
        - createTable:
            tableName: transaction_category
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transaction_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: userid
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transaction_category
            baseColumnNames: userid
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_category_users

  - changeSet:
      id: 4-create-transactions
      author: me
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_account_id
                  type: BIGINT
              - column:
                  name: to_account_id
                  type: BIGINT
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: from_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_transactions_from_account
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: to_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_transactions_to_account
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: category_id
            referencedTableName: transaction_category
            referencedColumnNames: id
            constraintName: fk_transactions_category

  - changeSet:
      id: 2-add-default-balance
      author: me
      changes:
        - addDefaultValue:
            tableName: accounts
            columnName: balance
            columnDataType: BIGINT
            defaultValue: 0

  - changeSet:
      id: 5-add-default-datetime-transactions
      author: me
      changes:
        - addDefaultValue:
            tableName: transactions
            columnName: date_time
            columnDataType: TIMESTAMP
            defaultValueComputed: current_datetime()
